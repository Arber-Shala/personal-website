<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=evice-width, intitial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="/static/css/contact.css">
<!-- *************************************************************************************** -->
    <!-- EmailJS SDK connection -->
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <script type="text/javascript">
      (function(){
          emailjs.init({
            publicKey: "%EMAIL_SDK%",
          });
      })();
    </script>
<!-- *************************************************************************************** -->
 <script src="script.js"></script>
 
  </head>
<body>
    <div class="container">
        <form>
          <h3>Get in touch!</h3>
          <input type="text" id="name" placeholder="Your Name" required>
          <input type="email" id="email" placeholder="Email" required>
          <input type="phone" id="phone" placeholder="Phone Number" required>
          <textarea id="message" rows="4" placeholder="Message"></textarea>
          <button type="submit" onclick="sendMail()"> Send </button>
        </form>
    </div>
    
</body>
</html>
